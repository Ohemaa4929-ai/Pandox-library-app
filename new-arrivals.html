<style>:root{--bg:#0e1117;--card:#161b24;--gold:#c9a24b;--tx:#f2f2f2;--mu:#9aa3b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;padding:env(safe-area-inset-top) 0 40px}
h1{font-size:20px;margin:16px 14px 4px;color:var(--gold)}.sub{margin:0 14px 10px;color:var(--mu);font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 12px}.tabs button{flex:none;background:var(--card);color:var(--tx);border:1px solid #2a3140;border-radius:20px;padding:8px 14px;font-size:13px}.tabs button.on{background:var(--gold);color:#0e1117;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}.c{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid #232a37}.c img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}.c div{padding:8px 10px}.c b{font-size:13px;font-weight:400;display:block;min-height:34px}.p{color:var(--gold);font-size:13px;margin-top:4px}.dp{font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 5px;margin-left:4px}
#m{position:fixed;inset:0;background:var(--bg);display:none;overflow:auto;padding:env(safe-area-inset-top) 14px 30px;z-index:5}#m.o{display:block}.x{background:none;border:0;color:var(--gold);font-size:16px;padding:14px 0}
.st{perspective:900px;background:#fff;border-radius:12px;overflow:hidden;height:min(70vw,420px);display:flex;align-items:center;justify-content:center}.st img{max-width:100%;max-height:100%;transition:transform .08s}
input[type=range]{width:100%;accent-color:#c9a24b;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row button,.wa{background:var(--gold);color:#0e1117;border:0;border-radius:8px;padding:11px 14px;font-size:14px;text-decoration:none;display:inline-block}.row button.g{background:var(--card);color:var(--gold);border:1px solid var(--gold)}
#ex{display:none;margin-top:12px;background:#0e1117}#ex img{width:100%;max-width:420px;display:block;margin:auto}.note{color:var(--mu);font-size:12px;margin:6px 0}</style></head><body>
